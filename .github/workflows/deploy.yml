name: Build Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r gmeek_src/requirements.txt

      - name: Build homepage
        run: python build.py

      - name: Build Gmeek blog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd gmeek_src
          python Gmeek.py "$GITHUB_TOKEN" "$GITHUB_REPOSITORY"

      - name: Move blog to /blog
        run: |
          rm -rf blog
          mkdir -p blog
          cp -r gmeek_src/docs/* blog/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!README.md'
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "Auto-build site [skip ci]"
          git push origin main
